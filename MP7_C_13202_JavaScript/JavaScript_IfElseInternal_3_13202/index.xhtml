<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML Basic 1.1//EN" "http://www.w3.org/TR/xhtml-basic/xhtml-basic11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
    <title>Form Peminjaman Buku (XHTML)</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <script type="text/javascript">
        var iTinggi;
        var sDampingi;

        iTinggi = prompt("Masukkan tinggi badan (cm).", 0);
        sDampingi = prompt("Didampingi orang dewasa? (Y)a atau (T)idak", "Y");

        if(iTinggi > 140){
            if(sDampingi == "Y"){
                alert("Boleh naik wahana ekstrem");
            }else{
                alert("Boleh naik, disarankan didampingi");
            }
        }else{
            if(sDampingi == "Y"){
                alert("Hanya wahana anak (didampingi)");
            }else{
                alert("Tidak boleh naik wahana");
            }
        }
    </script>
</head>

<body>
    <h1>If-Else Internal: Wahana Taman Hiburan</h1>
    <p>Reload halaman untuk mencoba lagi</p>
</body>

</html>
